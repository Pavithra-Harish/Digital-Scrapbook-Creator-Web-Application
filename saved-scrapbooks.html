<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Scrapbooks</title>
    <link rel="icon" type="image/x-icon" href="assets/logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Comfortaa", sans-serif;
            margin: 0;
            background: #f4ecff;
            color: #2c1a3f;
        }
        .topbar {
            background: linear-gradient(90deg, rgb(89, 22, 161), rgb(63, 16, 114));
            color: #fff;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topbar a {
            color: #fff;
            text-decoration: none;
            margin-left: 12px;
        }
        .container {
            max-width: 900px;
            margin: 24px auto;
            padding: 0 16px;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .card h3 {
            margin: 0 0 8px;
        }
        .meta {
            margin: 0 0 12px;
            font-size: 13px;
            color: #5f4c73;
        }
        button {
            border: none;
            border-radius: 6px;
            padding: 9px 14px;
            background: linear-gradient(rgb(89, 22, 161) 0%, rgb(63, 16, 114) 100%);
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <strong>Saved Scrapbooks</strong>
        <div>
            <a href="home.html">Home</a>
            <a href="canvas.html?new=1">Create New</a>
        </div>
    </div>

    <div class="container">
        <div id="saved-list"></div>
    </div>

    <script src="saved-scrapbooks.js"></script>
</body>
</html>
